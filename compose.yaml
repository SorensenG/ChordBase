services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chordbase}
      POSTGRES_USER: ${POSTGRES_USER:-chordbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chordbase}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chordbase} -d ${POSTGRES_DB:-chordbase}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chordbase}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-chordbase}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-chordbase}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-chordbase-api}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      JWT_TIME_ZONE: ${JWT_TIME_ZONE:-America/Sao_Paulo}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refreshToken}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-Lax}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/users}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-30MB}
      CHORDPRO_EXTRACTOR_BASE_URL: ${CHORDPRO_EXTRACTOR_BASE_URL:-http://host.docker.internal:8000}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
