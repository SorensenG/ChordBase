services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chordbase}
      POSTGRES_USER: ${POSTGRES_USER:-chordbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chordbase}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chordbase} -d ${POSTGRES_DB:-chordbase}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chordbase}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-chordbase}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-chordbase}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-chordbase-api}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-4}
      JWT_TIME_ZONE: ${JWT_TIME_ZONE:-America/Sao_Paulo}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
