server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:30MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:30MB}

security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=${JWT_ISSUER:chordbase-api}
security.jwt.access-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:15}
security.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
security.jwt.time-zone=${JWT_TIME_ZONE:America/Sao_Paulo}

security.refresh-cookie.name=${REFRESH_COOKIE_NAME:refreshToken}
security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
security.refresh-cookie.path=${REFRESH_COOKIE_PATH:/users}
chordpro.extractor.base-url=${CHORDPRO_EXTRACTOR_BASE_URL:http://localhost:8000}
chordpro.extractor.path=${CHORDPRO_EXTRACTOR_PATH:/api/v1/extractions/chordpro}
